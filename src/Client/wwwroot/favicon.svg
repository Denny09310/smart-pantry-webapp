<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#ffffff"/>
  <g stroke="#1e1e1e" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <!-- back rim of the tray -->
    <rect x="88" y="252" width="336" height="40" rx="16" fill="#b78565"/>
    <!-- dropper bottle (left rear) -->
    <rect x="138" y="118" width="52" height="40" rx="10" fill="#404652"/>
    <rect x="118" y="152" width="92" height="118" rx="18" fill="#ffd54a"/>
    <!-- perfume bottle (center rear) -->
    <rect x="232" y="48" width="52" height="32" rx="10" fill="#404652"/>
    <rect x="238" y="78" width="40" height="44" rx="8" fill="#ec6a9c"/>
    <rect x="196" y="118" width="124" height="152" rx="26" fill="#ec6a9c"/>
    <!-- cream jar (right rear) -->
    <rect x="302" y="172" width="120" height="38" rx="13" fill="#404652"/>
    <rect x="310" y="202" width="104" height="68" rx="16" fill="#a8e1f2"/>
    <!-- tray front -->
    <rect x="96" y="264" width="320" height="160" rx="26" fill="#d8a98c"/>
    <!-- handles -->
    <rect x="146" y="318" width="92" height="36" rx="18" fill="#b78565" stroke-width="11"/>
    <rect x="274" y="318" width="92" height="36" rx="18" fill="#b78565" stroke-width="11"/>
  </g>
  <!-- darker side shading (no outline) -->
  <rect x="288" y="136" width="20" height="116" rx="10" fill="#d95a86"/>
  <rect x="184" y="170" width="16" height="88" rx="8" fill="#f2b93e"/>
  <rect x="118" y="272" width="276" height="14" rx="7" fill="#c69474"/>
  <!-- white accents (no outline) -->
  <rect x="136" y="196" width="56" height="24" rx="12" fill="#ffffff"/>
  <rect x="222" y="168" width="72" height="48" rx="12" fill="#ffffff"/>
  <rect x="330" y="226" width="64" height="22" rx="11" fill="#ffffff"/>
</svg>
